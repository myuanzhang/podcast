apiVersion: v1
kind: Namespace
metadata:
  name: podcast-workflow
---
apiVersion: v1
kind: Secret
metadata:
  name: podcast-workflow-secrets
  namespace: podcast-workflow
type: Opaque
stringData:
  OPENAI_API_KEY: "replace-me"
  GEMINI_API_KEY: "replace-me"
  ANTHROPIC_API_KEY: "replace-me"
  GITHUB_TOKEN: "replace-me"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: podcast-workflow-config
  namespace: podcast-workflow
data:
  OPENAI_MODEL_NAME: "gpt-5"
  OPENAI_TTS_MODEL_NAME: "gpt-4o-mini-tts"
  GEMINI_MODEL_NAME: "gemini-2.5-flash"
  GEMINI_VEO_MODEL_NAME: "veo-3.1-fast-generate-preview"
  GEMINI_BASE_URL: "https://generativelanguage.googleapis.com/v1beta/openai/"
  ANTHROPIC_MODEL_NAME: "claude-sonnet-4-20250514"
  ANTHROPIC_BASE_URL: "https://api.anthropic.com/v1"
  LLAMA_MODEL_NAME: "llama3:8b"
  LLAMA_BASE_URL: "http://localhost:11434/v1"
  GITHUB_REPO: "erangaeb/regulatory-temp"
  OPENAI_AGENTS_DISABLE_TRACING: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podcast-workflow
  namespace: podcast-workflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podcast-workflow
  template:
    metadata:
      labels:
        app: podcast-workflow
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: api
          image: ghcr.io/erangaeb/podcast-workflow:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5003
          envFrom:
            - secretRef:
                name: podcast-workflow-secrets
            - configMapRef:
                name: podcast-workflow-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5003
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: podcast-workflow
  namespace: podcast-workflow
spec:
  selector:
    app: podcast-workflow
  ports:
    - name: http
      port: 80
      targetPort: 5003
  type: ClusterIP
